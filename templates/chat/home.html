{% block extra_head %}
    <style>
        /* Basic chat styles */
        #chat-log {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
        }
        #chat-message-input {
            width: 80%;
        }
        #chat-message-submit {
            width: 18%;
        }
    </style>
{% endblock %}
{% block content %}
    <div id="chat-log"></div>

    <input id="chat-message-input" type="text" size="100" autofocus placeholder="Type your message..." />
    <button id="chat-message-submit">Send</button>

    <script>
        (function() {
            // Get the username from the Django user context
            const username = "{{ request.user.username|escapejs }}";
            const roomName = "home";  // Single chat room named 'home'

            const chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
            );

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                const chatLog = document.getElementById('chat-log');
                let messageElement = document.createElement('div');

                if(data.type === 'chat_message') {
                    messageElement.textContent = data.username + ': ' + data.message;
                } else if(data.type === 'typing') {
                    messageElement.textContent = data.username + ' is typing...';
                    messageElement.style.fontStyle = 'italic';
                }

                chatLog.appendChild(messageElement);
                chatLog.scrollTop = chatLog.scrollHeight;  // auto-scroll
            };

            chatSocket.onclose = function(e) {
                console.error('Chat socket closed unexpectedly');
            };

            document.getElementById('chat-message-input').focus();

            document.getElementById('chat-message-input').onkeyup = function(e) {
                if(e.keyCode === 13) {  // enter key
                    document.getElementById('chat-message-submit').click();
                } else {
                    // Send typing indicator
                    chatSocket.send(JSON.stringify({
                        'type': 'typing',
                        'username': username,
                    }));
                }
            };

            document.getElementById('chat-message-submit').onclick = function(e) {
                const messageInputDom = document.getElementById('chat-message-input');
                const message = messageInputDom.value;
                if(message.trim() === '') return;
                chatSocket.send(JSON.stringify({
                    'type': 'chat_message',
                    'message': message,
                    'username': username
                }));
                messageInputDom.value = '';
            };
        })();
    </script>

{% endblock %}
