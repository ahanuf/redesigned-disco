{% extends "base.html" %}
{% load static %}

{% block title %}Task Calendar - Advanced Blog{% endblock %}

{% block extra_head %}
<link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css"
    rel="stylesheet"
/>

<style>
    /* =========================
       TASK PAGE
       ========================= */

    .task-page {
        min-height: calc(100vh - 120px);
    }

    .task-sidebar {
        height: 100%;
        border-radius: 1rem;
    }

    .task-sidebar-header {
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--bs-border-color);
    }

    .task-clock {
        font-size: 1.8rem;
        font-weight: 700;
        text-align: center;
    }

    .task-date {
        text-align: center;
        color: var(--bs-secondary-color);
    }

    .task-list {
        list-style: none;
        padding: 0;
        margin: 1rem 0 0;
    }

    .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border: 1px solid var(--bs-border-color);
        border-radius: 0.75rem;
        background: var(--bs-body-bg);
    }

    .task-item-content {
        min-width: 0;
    }

    .task-item-title {
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .task-item-time {
        font-size: 0.8rem;
        color: var(--bs-secondary-color);
    }

    .task-calendar-wrapper {
        min-height: 600px;
        padding: 1rem;
        border: 1px solid var(--bs-border-color);
        border-radius: 1rem;
        background: var(--bs-body-bg);
    }

    #calendar {
        width: 100%;
    }

    /* Make FullCalendar cooperate with Bootstrap */
    .fc {
        --fc-border-color: var(--bs-border-color);
        --fc-page-bg-color: var(--bs-body-bg);
        --fc-neutral-bg-color: var(--bs-tertiary-bg);
        --fc-list-event-hover-bg-color: var(--bs-tertiary-bg);
        --fc-today-bg-color: rgba(13, 110, 253, 0.08);
    }

    .fc .fc-button {
        text-transform: capitalize;
    }

    .fc .fc-toolbar-title {
        font-size: 1.35rem;
    }

    .task-priority-high {
        border-left: 4px solid #dc3545;
    }

    .task-priority-normal {
        border-left: 4px solid #0d6efd;
    }

    .task-priority-low {
        border-left: 4px solid #198754;
    }
</style>
{% endblock %}


{% block content %}

<div class="container-fluid py-4 task-page">

    <div class="row g-4">

        <!-- =========================
             SIDEBAR
             ========================= -->
        <div class="col-12 col-lg-3">

            <div class="card shadow-sm border-0 task-sidebar">

                <div class="card-body">

                    <div class="task-sidebar-header">

                        <div class="task-clock" id="task-clock">
                            --:--:--
                        </div>

                        <div class="task-date" id="task-date">
                            Loading...
                        </div>

                    </div>


                    <div class="d-grid mt-3">

                        <button
                            type="button"
                            class="btn btn-primary"
                            id="add-task-button"
                        >
                            <i class="fas fa-plus me-1"></i>
                            Add Task
                        </button>

                    </div>


                    <h6 class="mt-4 mb-2 fw-bold">
                        Tasks
                    </h6>

                    <ul
                        class="task-list"
                        id="task-list"
                    >
                        <li class="text-muted text-center">
                            Loading tasks...
                        </li>
                    </ul>

                </div>

            </div>

        </div>


        <!-- =========================
             CALENDAR
             ========================= -->
        <div class="col-12 col-lg-9">

            <div class="task-calendar-wrapper shadow-sm">

                <div id="calendar"></div>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     TASK MODAL
     ========================= -->

<div
    class="modal fade"
    id="task-modal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <form id="task-form">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="fas fa-tasks me-2"></i>
                        Add Task
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <div class="modal-body">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label
                            for="task-title"
                            class="form-label"
                        >
                            Task
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="task-title"
                            name="title"
                            placeholder="What do you need to do?"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label
                            for="task-description"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="task-description"
                            name="description"
                            rows="3"
                            placeholder="Optional details..."
                        ></textarea>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="task-start"
                                class="form-label"
                            >
                                Start
                            </label>

                            <input
                                type="datetime-local"
                                class="form-control"
                                id="task-start"
                                name="start"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="task-end"
                                class="form-label"
                            >
                                End
                            </label>

                            <input
                                type="datetime-local"
                                class="form-control"
                                id="task-end"
                                name="end"
                                required
                            >

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="task-priority"
                                class="form-label"
                            >
                                Priority
                            </label>

                            <select
                                class="form-select"
                                id="task-priority"
                                name="priority"
                            >

                                <option value="Low">
                                    Low
                                </option>

                                <option
                                    value="Normal"
                                    selected
                                >
                                    Normal
                                </option>

                                <option value="High">
                                    High
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="task-recurrence"
                                class="form-label"
                            >
                                Repeat
                            </label>

                            <select
                                class="form-select"
                                id="task-recurrence"
                                name="recurrence"
                            >

                                <option value="N">
                                    None
                                </option>

                                <option value="D">
                                    Daily
                                </option>

                                <option value="W">
                                    Weekly
                                </option>

                                <option value="M">
                                    Monthly
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="fas fa-save me-1"></i>
                        Save Task
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}


{% block extra_js %}

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /*
     * ================================
     * CONFIGURATION
     * ================================
     */

    const API_LIST = "{% url 'tasks:tasks_api' %}";
    const API_CREATE = "{% url 'tasks:create_task_api' %}";

    const clockElement = document.getElementById("task-clock");
    const dateElement = document.getElementById("task-date");
    const taskList = document.getElementById("task-list");
    const taskForm = document.getElementById("task-form");
    const addTaskButton = document.getElementById("add-task-button");

    const modalElement = document.getElementById("task-modal");

    const taskModal = new bootstrap.Modal(modalElement);


    /*
     * ================================
     * STATE
     * ================================
     */

    let selectedDate = new Date();


    /*
     * ================================
     * CSRF
     * ================================
     */

    function getCSRFToken() {

        const cookie = document.cookie
            .split("; ")
            .find(row => row.startsWith("csrftoken="));

        return cookie
            ? decodeURIComponent(cookie.split("=")[1])
            : "";
    }


    /*
     * ================================
     * CLOCK
     * ================================
     */

    function updateClock() {

        const now = new Date();

        clockElement.textContent =
            now.toLocaleTimeString();

        dateElement.textContent =
            now.toLocaleDateString(
                undefined,
                {
                    weekday: "long",
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );
    }

    updateClock();

    setInterval(
        updateClock,
        1000
    );


    /*
     * ================================
     * DATE HELPERS
     * ================================
     */

    function formatDate(date) {

        const year = date.getFullYear();

        const month = String(
            date.getMonth() + 1
        ).padStart(2, "0");

        const day = String(
            date.getDate()
        ).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    /*
     * ================================
     * LOAD SIDEBAR TASKS
     * ================================
     */

    async function loadTasks(date) {

        const dateString = formatDate(date);

        taskList.innerHTML = `
            <li class="text-muted text-center">
                Loading...
            </li>
        `;

        try {

            const response = await fetch(
                `${API_LIST}?date=${encodeURIComponent(dateString)}`
            );

            if (!response.ok) {
                throw new Error(
                    "Failed to load tasks."
                );
            }

            const tasks = await response.json();

            renderTaskList(tasks);

        } catch (error) {

            console.error(error);

            taskList.innerHTML = `
                <li class="text-danger text-center">
                    Failed to load tasks.
                </li>
            `;
        }
    }


    /*
     * ================================
     * RENDER SIDEBAR
     * ================================
     */

    function renderTaskList(tasks) {

        taskList.innerHTML = "";

        if (!tasks.length) {

            taskList.innerHTML = `
                <li class="text-muted text-center py-3">
                    No tasks for this day.
                </li>
            `;

            return;
        }


        tasks.forEach(task => {

            const item = document.createElement("li");

            item.className =
                "task-item";


            const content =
                document.createElement("div");

            content.className =
                "task-item-content";


            const title =
                document.createElement("div");

            title.className =
                "task-item-title";

            title.textContent =
                task.title;


            const time =
                document.createElement("div");

            time.className =
                "task-item-time";

            time.textContent =
                `${formatTime(task.start)} – ${formatTime(task.end)}`;


            content.appendChild(title);
            content.appendChild(time);


            const deleteButton =
                document.createElement("button");

            deleteButton.type =
                "button";

            deleteButton.className =
                "btn btn-sm btn-outline-danger";

            deleteButton.innerHTML =
                '<i class="fas fa-trash"></i>';


            deleteButton.addEventListener(
                "click",
                () => deleteTask(task.id)
            );


            item.appendChild(content);
            item.appendChild(deleteButton);

            taskList.appendChild(item);

        });
    }


    /*
     * ================================
     * TIME FORMAT
     * ================================
     */

    function formatTime(dateTime) {

        return new Date(dateTime)
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );
    }


    /*
     * ================================
     * DELETE
     * ================================
     */

    async function deleteTask(taskId) {

        if (!confirm(
            "Delete this task?"
        )) {
            return;
        }


        try {

            const response = await fetch(
                `/tasks/api/${taskId}/delete/`,
                {
                    method: "POST",

                    headers: {
                        "X-CSRFToken":
                            getCSRFToken()
                    }
                }
            );


            const data =
                await response.json();


            if (!response.ok ||
                data.status !== "success") {

                throw new Error(
                    "Unable to delete task."
                );
            }


            calendar.refetchEvents();

            loadTasks(selectedDate);


        } catch (error) {

            console.error(error);

            alert(
                "Could not delete the task."
            );
        }
    }


    /*
     * ================================
     * OPEN MODAL
     * ================================
     */

    addTaskButton.addEventListener(
        "click",
        function () {

            taskForm.reset();

            const date =
                formatDate(selectedDate);

            document.getElementById(
                "task-start"
            ).value =
                `${date}T09:00`;

            document.getElementById(
                "task-end"
            ).value =
                `${date}T10:00`;

            taskModal.show();
        }
    );


    /*
     * ================================
     * CREATE TASK
     * ================================
     */

    taskForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const formData =
                new FormData(taskForm);


            try {

                const response =
                    await fetch(
                        API_CREATE,
                        {
                            method: "POST",

                            headers: {
                                "X-CSRFToken":
                                    getCSRFToken()
                            },

                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok ||
                    data.status !== "success") {

                    console.error(data);

                    throw new Error(
                        "Task creation failed."
                    );
                }


                taskModal.hide();

                taskForm.reset();

                calendar.refetchEvents();

                loadTasks(selectedDate);


            } catch (error) {

                console.error(error);

                alert(
                    "Could not create the task."
                );
            }
        }
    );


    /*
     * ================================
     * FULLCALENDAR
     * ================================
     */

    const calendarElement =
        document.getElementById(
            "calendar"
        );


    const calendar =
        new FullCalendar.Calendar(
            calendarElement,
            {

                initialView:
                    "dayGridMonth",

                height:
                    "auto",

                selectable:
                    true,

                navLinks:
                    true,

                headerToolbar: {
                    left:
                        "prev,next today",

                    center:
                        "title",

                    right:
                        "dayGridMonth,timeGridWeek,timeGridDay"
                },


                /*
                 * Calendar asks Django
                 * for its current date range.
                 */

                events: async function (
                    info,
                    successCallback,
                    failureCallback
                ) {

                    try {

                        const response =
                            await fetch(
                                `${API_LIST}?start=${encodeURIComponent(info.startStr)}&end=${encodeURIComponent(info.endStr)}`
                            );


                        if (!response.ok) {
                            throw new Error(
                                "Calendar API failed."
                            );
                        }


                        const events =
                            await response.json();


                        successCallback(
                            events
                        );

                    } catch (error) {

                        console.error(error);

                        failureCallback(
                            error
                        );
                    }
                },


                /*
                 * Clicking a calendar date
                 * changes the sidebar date.
                 */

                dateClick:
                    function (info) {

                        selectedDate =
                            info.date;

                        loadTasks(
                            selectedDate
                        );
                    },


                /*
                 * Clicking an existing event.
                 */

                eventClick:
                    function (info) {

                        alert(
                            info.event.title
                        );
                    }

            }
        );


    calendar.render();


    /*
     * ================================
     * INITIAL SIDEBAR
     * ================================
     */

    loadTasks(
        selectedDate
    );

});
</script>

{% endblock %}
