services:

  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: "31y6x@c&ys4iu)ph!xs^dk#48jxq#$_)m$bs45ci&7$z)ir2c9"
      DEBUG: "True"
      POSTGRES_DB: postdatabase
      POSTGRES_USER: ubun
      POSTGRES_PASSWORD: devpassword
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postdatabase
      POSTGRES_USER: ubun
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubun -d postdatabase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: